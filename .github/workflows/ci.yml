name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Skip runs for commits that touch no code (e.g. repository housekeeping).
    paths:
      - "packages/**"
      - "docs/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Pitch word-count gate
        run: node scripts/pitch-wordcount.mjs docs/doe/pitch.md

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright chromium
        run: pnpm --filter @thermopulse/studio exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm --filter @thermopulse/studio test:e2e

      - name: Build
        run: pnpm build
